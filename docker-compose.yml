services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: judith-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: judith
      POSTGRES_PASSWORD: judith
      POSTGRES_DB: judith
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U judith -d judith"]
      interval: 5s
      timeout: 5s
      retries: 10

  evolution-redis:
    image: redis:7-alpine
    container_name: judith-evolution-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - evolution_redis:/data

  evolution:
    image: evoapicloud/evolution-api:v2.3.7
    container_name: judith-evolution
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      evolution-redis:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      SERVER_TYPE: http
      SERVER_PORT: 8080
      SERVER_URL: http://localhost:8080
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-troque-esta-chave-em-producao}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "true"
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://judith:judith@postgres:5432/evolution
      DATABASE_CONNECTION_CLIENT_NAME: evolution_judith
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://evolution-redis:6379
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_LOCAL_ENABLED: "false"
      WEBHOOK_GLOBAL_ENABLED: "false"
      WEBHOOK_GLOBAL_URL: ""
      CONFIG_SESSION_PHONE_CLIENT: JUDITH
      CONFIG_SESSION_PHONE_NAME: Chrome
      QRCODE_LIMIT: "30"
      LANGUAGE: pt-BR
    volumes:
      - evolution_instances:/evolution/instances

volumes:
  postgres_data:
  evolution_redis:
  evolution_instances:
